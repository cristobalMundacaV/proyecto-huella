services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-proyecto_huella}
      POSTGRES_USER: ${DATABASE_USER:-proyecto_huella}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-proyecto_huella}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-proyecto_huella} -d ${DATABASE_NAME:-proyecto_huella}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-change-me-in-dev-only}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DATABASE_ENGINE: django.db.backends.postgresql
      DATABASE_NAME: ${DATABASE_NAME:-proyecto_huella}
      DATABASE_USER: ${DATABASE_USER:-proyecto_huella}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-proyecto_huella}
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      CORS_ALLOW_ALL_ORIGINS: ${CORS_ALLOW_ALL_ORIGINS:-True}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PUBLIC_FRONTEND_URL: ${PUBLIC_FRONTEND_URL:-http://localhost:5173}
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - backend_media:/app/media
    ports:
      - "8000:8000"

volumes:
  postgres_data:
  backend_media: