services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-proyecto_huella}
      POSTGRES_USER: ${DATABASE_USER:-proyecto_huella}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-proyecto_huella}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-proyecto_huella} -d ${DATABASE_NAME:-proyecto_huella}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-change-me-in-dev-only}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,100.28.53.53,carbonozero.mundacasolutions.com},backend

      DATABASE_ENGINE: django.db.backends.postgresql
      DATABASE_NAME: ${DATABASE_NAME:-proyecto_huella}
      DATABASE_USER: ${DATABASE_USER:-proyecto_huella}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-proyecto_huella}
      DATABASE_HOST: db
      DATABASE_PORT: 5432

      CORS_ALLOW_ALL_ORIGINS: ${CORS_ALLOW_ALL_ORIGINS:-True}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://100.28.53.53:5173,http://carbonozero.mundacasolutions.com,https://carbonozero.mundacasolutions.com}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://100.28.53.53:5173,http://carbonozero.mundacasolutions.com,https://carbonozero.mundacasolutions.com}

      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PUBLIC_FRONTEND_URL: ${PUBLIC_FRONTEND_URL:-https://carbonozero.mundacasolutions.com}

    command: >
      sh -c "
        echo 'Esperando PostgreSQL...';
        until python -c 'import socket; socket.gethostbyname(\"db\"); socket.create_connection((\"db\", 5432), 5).close()'; do
          echo 'DB no lista, esperando...';
          sleep 2;
        done;

        python manage.py migrate &&
        python manage.py runserver 0.0.0.0:8000
      "
    volumes:
      - ./backend:/app
      - backend_media:/app/media

  simulador-sensores:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      API_URL: http://backend:8000/api/iot/lecturas/
      SIMULATOR_INTERVAL_SECONDS: 5
    command: python scripts/simulador_sensores.py
    volumes:
      - ./backend:/app

volumes:
  postgres_data:
  backend_media:
