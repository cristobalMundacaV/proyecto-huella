name: carbono-zero-tests

services:
  db-test:
    image: postgres:16-alpine
    restart: "no"
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_DB: carbono_zero_test
      POSTGRES_USER: carbono_zero_test
      POSTGRES_PASSWORD: carbono_zero_test_local_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carbono_zero_test -d carbono_zero_test"]
      interval: 2s
      timeout: 5s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data
