server {
    listen 80;
    listen [::]:80;
    server_name carbonozero.mundacasolutions.com app.carbonozero.mundacasolutions.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name carbonozero.mundacasolutions.com;

    root /var/www/carbonozero;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/carbonozero.mundacasolutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/carbonozero.mundacasolutions.com/privkey.pem;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = / {
        try_files /index.html =404;
    }

    location ^~ /verificar/ {
        try_files $uri $uri/ /index.html;
    }

    location = /app {
        return 302 https://app.carbonozero.mundacasolutions.com/login;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(?:ico|png|jpe?g|gif|svg|webp|woff2?|ttf|map|css|js)$ {
        try_files $uri =404;
    }

    location / {
        return 302 https://app.carbonozero.mundacasolutions.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.carbonozero.mundacasolutions.com;

    root /var/www/carbonozero;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/carbonozero.mundacasolutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/carbonozero.mundacasolutions.com/privkey.pem;

    add_header X-Robots-Tag "noindex, nofollow" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = / {
        return 302 /login;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
